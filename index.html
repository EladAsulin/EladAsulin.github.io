<style>

:root{--black:#000;--white:#fff;--disp:Jost,Futura,"Century Gothic",Arial,sans-serif;--text:Jost,Futura,"Century Gothic",Arial,sans-serif;

*{box-sizing:border-box}a{color:inherit;text-decoration:none}h1,h2,p{margin:0;font-weight:400;font-size:inherit}

  -webkit-mask:radial-gradient(closest-side,#000 70%,#0008 86%,#0000);mask:radial-gradient(closest-side,#000 70%,#0008 86%,#0000)}

.col{position:relative;z-index:2;min-height:100vh;min-height:100dvh;padding:0 var(--gr) calc(var(--u)*8) var(--gl);padding-top:calc(var(--u)*5 + 34px + 13vh);display:flex;flex-direction:column;align-items:flex-start}
.t{position:relative;display:block;max-width:min(100%,30em)}
.t::before{content:"";position:absolute;z-index:-1;inset:-6px -20px;background:#000b;filter:blur(12px);opacity:0}
.t:has(.lit)::before,.calm .t::before{opacity:1}
.w{opacity:0}.w.lit,.calm .w{opacity:1}
.back{position:absolute;top:calc(var(--u)*5);left:var(--gl);padding-block:4px}

#about p{font:400 var(--mid)/1.5 var(--disp);max-width:min(100%,23em)}#about p+p{margin-top:calc(var(--u)*4)}

#film{padding-top:calc(var(--u)*5 + 34px + var(--u)*4)}
.screen{width:min(100%,calc(70vh*var(--a)));aspect-ratio:var(--a);background:#000;animation:iris .9s cubic-bezier(.2,.7,.2,1)}
.screen{position:relative}.screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@keyframes iris{from{clip-path:circle(12% at 50% 50%)}to{clip-path:circle(75% at 50% 50%)}}

#work{--shift:0px;--pad:0px}#work::before{content:"";display:block;height:var(--shift)}#work::after{content:"";height:var(--pad)}

.row{display:grid;grid-template-columns:var(--tw) minmax(0,1fr);gap:0 clamp(14px,1.8vw,28px);align-items:center;padding:9px 0;--tw:208px;--vh:164px;max-width:860px}.row .tx{min-width:0}

.th .im::after{content:"";position:absolute;left:10px;bottom:9px;border:solid #0000;border-width:5px 0 5px 9px;border-left-color:#fff;filter:drop-shadow(0 0 3px #000)}
.row.on{display:block}.row.on .th{display:none}.row.on .tx{padding-top:8px}

</head><body>
<div id="app" dir="ltr" lang="en"><div id="beam" aria-hidden="true"><canvas width="900" height="900"></canvas></div><div id="tag" aria-hidden="true"></div><main id="views" tabindex="-1"></main></div>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)],calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
const MAIL='gfasolin@gmail.com',TEL='+972 50-601-9922',root=document.documentElement,views=$('#views'),beam=$('#beam'),tag=$('#tag'),cv=$('canvas'),cx=cv.getContext('2d');
const STEP=calm?90:27,esc=s=>s.replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
let F=[],page='',cur=null,scope=null,shown={film:null,i:-1};
if(calm)root.classList.add('calm');

const seen=new Set();try{JSON.parse(sessionStorage.getItem('lit')||'[]').forEach(k=>seen.add(k))}catch{}
function light(w){if(w.classList.contains('lit'))return;w.classList.add('lit');seen.add(w.dataset.k);clearTimeout(light.t);light.t=setTimeout(()=>{try{sessionStorage.setItem('lit',JSON.stringify([...seen]))}catch{}},150)}
const W=(k,text,attr='')=>text.split(' ').map((w,i)=>`<span class="w${seen.has(k+i)?' lit':''}" data-k="${k+i}"${attr}>${esc(w)}</span>`).join(' ');
const line=(tag,cls,k,text,href)=>`<${tag} dir="auto" class="t ${cls}"${href?` href="${href}" draggable="false"`:''}>${W(k,text)}</${tag}>`;

const POOL=innerWidth<700?6:10,USES=3;
let decks=[],queue=[],loading=0,turn=0,gen=0;
const packNo={};
const inScope=()=>scope||F.filter(f=>!f.no_beam);
function shuffle(a){for(let i=a.length;i>1;){const j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a}

async function pull(){const list=inScope();if(!list.length)return;const want=Math.min(POOL,list.length===1?2:list.length);
  while(decks.length+loading<want){
    const free=queue.filter(f=>list.includes(f)&&!(list.length>1&&decks.some(d=>d.f===f)));let f=free[0];
    if(f)queue.splice(queue.indexOf(f),1);else{const rest=list.filter(f=>list.length===1||!decks.some(d=>d.f===f));if(!rest.length||queue.filled===turn&&loading){break}queue=shuffle([...rest]);queue.filled=turn;f=queue.shift()}
    loading++;const g=gen,n=f.packs||1,k=packNo[f.id]=((packNo[f.id]??(Math.random()*n|0))+1)%n;
    fetch(`f/${f.id}-${k}.json`).then(r=>{if(!r.ok)throw 0;return r.json()}).then(a=>{if(g!==gen)return;
      const d={f,k,n:a.length,blobs:a.map(b=>new Blob([Uint8Array.from(atob(b),c=>c.charCodeAt(0))],{type:'image/jpeg'})),order:shuffle(a.map((_,i)=>i)),ready:[],busy:0,used:0};decks.push(d);fill(d)})
      .catch(()=>{f.bad=1}).finally(()=>{if(g===gen){loading--;if(!f.bad)pull()}});
    if(list.every(f=>f.bad))break}}
function fill(d){const n=scope&&scope.length<3?8:4;while(d.ready.length+d.busy<n){d.busy++;if(!d.order.length)d.order=shuffle(d.blobs.map((_,i)=>i));const i=d.order.pop();
  createImageBitmap(d.blobs[i]).then(b=>d.ready.push({i,b})).catch(()=>{}).finally(()=>{d.busy--;if(shown.i<0)cut()})}}
function drop(d){decks.splice(decks.indexOf(d),1);d.ready.forEach(x=>x.b.close());d.ready=[]}
const ratio=f=>f.aspect.split('/').reduce((a,b)=>a/b),shape=f=>Math.abs(ratio(f)-16/9)<.1?1:ratio(f);
let bw=0,bh=0,bs=1;
function setShape(a){bs=a;bw=a===1?r:a<1?r*1.2*a:r*1.25;bh=a===1?r:a<1?r*1.2:r*1.25/a;beam.classList.toggle('own',a!==1);root.style.setProperty('--bw',bw.toFixed(1)+'px');root.style.setProperty('--bh',bh.toFixed(1)+'px')}
function cut(){if(isPlaying())return false;const list=inScope(),key=(d,x)=>d.f.id+':'+d.k+'.'+x.i;
  const ok=decks.filter(d=>list.includes(d.f)&&d.ready.some(x=>key(d,x)!==shown.i));if(!ok.length){pull();return false}
  let c=ok.filter(d=>d.f!==shown.film);if(!c.length)c=ok;
  const low=Math.min(...c.map(d=>d.last??-1)),d=c.find(d=>(d.last??-1)===low);d.last=++turn;
  const {i,b}=d.ready.splice(d.ready.findIndex(x=>key(d,x)!==shown.i),1)[0],a=shape(d.f),W0=a<1?Math.round(900*a):900,H0=a>1?Math.round(900/a):900;if(cv.width!==W0||cv.height!==H0){cv.width=W0;cv.height=H0}
  const s=Math.max(W0/b.width,H0/b.height),w=b.width*s,h=b.height*s;cx.drawImage(b,(W0-w)/2,(H0-h)/2,w,h);b.close();setShape(a);shown={film:d.f,i:key(d,{i})};cv.dataset.frame=shown.i;
  const more=list.length>POOL||(list.length<3&&(d.f.packs||1)>1);
  if(++d.used>=(list.length<3?8:USES)&&more&&decks.length>1&&decks.length>=Math.min(POOL,list.length)-2){drop(d);pull()}else fill(d);
  label();return true}
function setScope(n){if(n){n=n.filter(f=>!f.no_beam);if(!n.length)n=null}const k=a=>a&&a.map(f=>f.id).join();if(k(n)===k(scope))return;scope=n;gen++;loading=0;queue=[];const l=inScope();[...decks].forEach(d=>{if(!l.includes(d.f))drop(d);else fill(d)});pull();if(n&&!n.includes(shown.film)&&!cut())setTimeout(cut,160)}
function label(){tag.textContent=shown.film&&page==='home'?shown.film.title:''}


let tx=0,ty=0,x=0,y=0,r=0,acc=0,lx=null,ly,raf=0,idle=0,drift=null,driftRaf=0;
const R=()=>Math.min(innerWidth*.40,innerHeight*.25,230);
function paint(){root.style.setProperty('--x',x.toFixed(1)+'px');root.style.setProperty('--y',y.toFixed(1)+'px');root.style.setProperty('--r',r.toFixed(1)+'px');
  for(const w of $$('.w:not(.lit)')){const b=w.getBoundingClientRect();if(!b.height)continue;const cx=b.left+b.width/2,cy=b.top+b.height/2,nx=Math.max(b.left,Math.min(x,b.right)),ny=Math.max(b.top,Math.min(y,b.bottom));
    if(Math.hypot((cx-x)/bw,(cy-y)/bh)<.84||Math.hypot((nx-x)/bw,(ny-y)/bh)<.45)light(w)}
  place()}
function place(){if(!tag.textContent)return;const a=tag.getBoundingClientRect();tag.style.visibility=a.bottom>innerHeight||$$('.t').some(t=>{const b=t.getBoundingClientRect();return a.right>b.left-8&&a.left<b.right+8&&a.bottom>b.top&&a.top<b.bottom})?'hidden':''}
function tick(){const k=calm?1:.34;x+=(tx-x)*k;y+=(ty-y)*k;paint();raf=Math.abs(tx-x)+Math.abs(ty-y)>.3?requestAnimationFrame(tick):0}
function go(){if(!raf)raf=requestAnimationFrame(tick)}
function travel(px,py){if(lx!=null)acc+=Math.hypot(px-lx,py-ly);lx=px;ly=py;if(acc>=STEP){acc%=STEP;cut()}}
function move(px,py,dy=0){stopDrift();arm();travel(px,py);tx=px;ty=py+dy;aim(px,py);go()}

function aim(px,py){if(page!=='work')return;const l=$$('#work .cat,#work .row').find(e=>{const b=e.getBoundingClientRect();return b.height&&py>=b.top&&py<=b.bottom});
  clearTimeout(aim.t);
  if(!l){setScope(null);return}
  const one=F.find(f=>f.id===l.dataset.s);setScope(one?[one]:F.filter(f=>f.category===l.dataset.s));
  if(!one&&l.getAttribute('aria-expanded')!=='true'&&!isPlaying()&&(!touching||$('.col').classList.contains('fit')))aim.t=setTimeout(()=>openCat(l),260)}

function openCat(h,force){const g=h.parentNode,open=force||h.getAttribute('aria-expanded')!=='true';
  anchor(h,()=>{stopInline();$$('#work .group').forEach(e=>{const on=e===g&&open;e.classList.toggle('open',on);$('.cat',e).setAttribute('aria-expanded',on)})});
  try{sessionStorage.setItem('open',open?h.dataset.s:'')}catch{};fitPage();paint()}
function arm(){clearTimeout(idle);if(!calm&&drift!=='done')idle=setTimeout(startDrift,6000)}
function stopDrift(){cancelAnimationFrame(driftRaf);driftRaf=0}
function startDrift(){const v=$('video');if(v&&!v.paused){arm();return}if(!$$('.w:not(.lit)').some(w=>w.offsetParent)||drift==='done')return;drift='done';
  const ls=$$('.t').map(e=>e.getBoundingClientRect()).filter(b=>b.height&&b.top<innerHeight),end=Math.min(innerHeight-30,Math.max(...ls.map(b=>b.bottom))-10),cxx=parseFloat(getComputedStyle($('.col')).paddingLeft)+Math.min(r*.75,innerWidth*.36);
  let t0;lx=null;const step=t=>{const dt=Math.min(50,t-(t0??t));t0=t;tx+=(cxx-tx)*.03;ty+=dt*.07;travel(tx,ty);go();if(ty<end)driftRaf=requestAnimationFrame(step)};driftRaf=requestAnimationFrame(step)}


const ORDER=['Commercials & Brand Films','Campaigns','Documentary','Fiction & Music Videos','Animation & AI'],NAV=[['work','Work'],['about','About'],['contact','Contact']];
const cats=()=>[...new Set(F.filter(f=>!f.no_beam).map(f=>f.category))].sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b));
const ABOUT=['Director, editor and cinematographer.','I have made hundreds of films and dozens of campaigns for the country\'s largest organizations: commercials, brand films, documentary and fiction.','I listen to people, help them find their words, and turn a mass of material into one clear story.'];
const thumb=(f,on)=>`<span class="w im${on||seen.has('t-'+f.id)?' lit':''}" data-k="t-${f.id}" style="background-image:url(t/${f.id}.jpg);background-position:${(f.thumb%4)/3*100}% ${(f.thumb/4|0)/2*100}%"></span>`;
const row=f=>`<div class="row" data-s="${f.id}" style="--a:${f.aspect.split('/').reduce((a,b)=>a/b).toFixed(4)}"><button type="button" class="th" aria-label="Play ${esc(f.title)}">${thumb(f)}</button><div class="tx">`+line('a','link','f-'+f.id,f.title,'#film-'+f.id)+(f.line?line('p','d','l-'+f.id,f.line):'')+`</div></div>`;

const isPlaying=()=>{const v=$('video');return !!v&&!v.paused&&!v.ended};
function stopInline(){const p=$('.player');if(!p)return null;const r=p.closest('.row'),v=$('video',p);v.pause();p.remove();r.classList.remove('on');return r}
function closeInline(focus){const r=$('.row.on');if(!r)return;anchor(r,stopInline);if(focus)$('.th',r).focus({preventScroll:true});paint()}
function playInline(r){const f=F.find(f=>f.id===r.dataset.s);$$('.w',r).forEach(light);clearTimeout(aim.t);stopDrift();
  anchor(r,()=>{stopInline();r.classList.add('on');const d=document.createElement('div');d.className='player';
    d.innerHTML=`<video controls playsinline preload="none" src="v/${f.episodes?f.episodes[0].v:f.id}.mp4" aria-label="${esc(f.title)}"></video><button type="button" class="x">Close</button>`;r.prepend(d);$('.x',d).onclick=()=>closeInline(true)});
  const v=$('video',r);v.play().catch(()=>{});v.focus({preventScroll:true});
  const b=r.getBoundingClientRect(),over=$('.player',r).getBoundingClientRect().bottom-innerHeight;if(over>0)scrollBy(0,Math.min(over+12,b.top-12))}
function anchor(h,fn){const was=h.getBoundingClientRect().top,col=$('#work');fn();col.style.setProperty('--shift','0px');col.style.setProperty('--pad','0px');scrollTo(0,0);
  const d=h.getBoundingClientRect().top-was;if(d<0)col.style.setProperty('--shift',-d+'px');else scrollTo(0,d);
  const left=h.getBoundingClientRect().top-was;if(left>1){col.style.setProperty('--pad',left+'px');scrollTo(0,d)}}
const T={
home:()=>line('h1','name','name',TXT('page-home','name','Elad Asulin'))+line('p','role','role',TXT('page-home','role','Director · Editor · Cinematographer'))+NAV.map(([k,t])=>line('a','link','n-'+k,t,'#'+k)).join(''),
work:()=>F.filter(f=>f.no_beam).map(row).join('')+cats().map(c=>`<div class="group">`+line('button','cat','c-'+esc(c),c).replace('<button',`<button type="button" aria-expanded="false" data-s="${esc(c)}"`)+`<div class="films">${F.filter(f=>f.category===c&&!f.no_beam).map(row).join('')}</div></div>`).join(''),
film:()=>{const f=cur,e=f.episodes,v=e?e[0].v:f.id;return `<div class="screen"><video controls playsinline preload="metadata" poster="p/${f.id}.jpg" src="v/${v}.mp4" aria-label="${esc(f.title)}"></video></div>`+line('h1','','f-'+f.id,f.title)+(f.line?line('p','d','l-'+f.id,f.line):'')+['role','client','year'].filter(k=>f[k]).map(k=>line('p','m',k+'-'+f.id,k[0].toUpperCase()+k.slice(1)+': '+f[k])).join('')+(e?`<div class="eps">${e.map((x,i)=>line('button','ep','e-'+f.id+i+'-',x.title||'Episode '+(i+1)).replace('<button',`<button type="button" data-v="${x.v}"${i?'':' aria-current="true"'}`)).join('')}</div>`:'')},
about:()=>['p1','p2','p3'].map((k,i)=>line('p','','a'+i+'-',TXT('page-about',k,ABOUT[i]))).join(''),
contact:()=>`<p class="t v"><bdi dir="ltr">${W('mail',MAIL)}</bdi></p><div class="t s"><button type="button" data-v="${MAIL}" aria-label="Copy email">${W('cm','Copy')}</button></div><p class="t v"><bdi dir="ltr">${W('tel',TEL)}</bdi></p><div class="t s"><button type="button" data-v="${TEL}" aria-label="Copy phone number">${W('ct','Copy')}</button><a href="https://wa.me/972506019922" target="_blank" rel="noopener">${W('wa','WhatsApp')}</a></div>`
};
function route(first,keep){const h=location.hash.slice(1)||'home',m=h.match(/^film-(.+)$/);cur=m&&F.find(f=>f.id===m[1]);
 const p=cur?'film':T[h]&&h!=='film'?h:'home',sy=scrollY;$('video')?.pause();page=p;acc=0;lx=null;stopDrift();drift=null;tag.textContent='';clearTimeout(aim.t);

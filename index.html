  const b=t.getBoundingClientRect(),hx=Math.min(from.right+18,innerWidth-72),hy=from.top+from.height/2,a=area.classList.contains('films')?Math.PI/2:Math.atan2(b.top+b.height/2-hy,b.left-hx);

  hint.style.transform=cb?`translate(${(cb.left-28).toFixed(1)}px,${(cb.top+cb.height/2).toFixed(1)}px) rotate(1.571rad)`:`translate(${hx.toFixed(1)}px,${hy.toFixed(1)}px) rotate(${a.toFixed(3)}rad)`;hint.in=area;hint.t=performance.now();hint.classList.remove('drawn','trk','slow');void hint.offsetWidth;hint.classList.add('on','drawn')}

const packNo={};
const inScope=()=>scope||F.filter(f=>!f.no_beam);

const PF={on:!coarse,list:null,ready:[],busy:0,recent:[]},pfor=l=>PF.list?PF.list.filter(p=>l.some(f=>f.id===p.f)):[];

  for(let i=1;i<d.length;i++)if(d[i].f===d[i-1].f){const k=d.findIndex((x,j)=>j>i&&x.f!==d[i-1].f&&(!d[j+1]||d[j+1].f!==d[i].f));if(k>0)[d[i],d[k]]=[d[k],d[i]]}

    let p=null;for(let t=0;t<a.length&&!p;t++){const q=pnext(a);if(q&&!has(q))p=q}if(!p)break;
    PF.busy++;
    fetch(`fp/${String(p.n).padStart(3,'0')}.jpg`).then(r=>{if(!r.ok)throw 0;return r.blob()}).then(createImageBitmap).then(b=>{PF.ready.push({p,b});while(PF.ready.length>12)PF.ready.shift().b.close()}).catch(()=>{})
      .finally(()=>{PF.busy--;if(shown.i<0||!inScope().includes(shown.film))cut()})}}

function pcut(){const l=inScope();if(!pUse(l))return false;pfill();const ok=PF.ready.filter(x=>l.some(f=>f.id===x.p.f)&&'p'+x.p.n!==shown.i);let c=ok.filter(x=>x.p.f!==shown.film?.id);if(!c.length&&l.length===1)c=ok;if(!c.length)return false;
  const x=c[0];PF.ready.splice(PF.ready.indexOf(x),1);if(cv.width!==CV||cv.height!==CV){cv.width=CV;cv.height=CV}cx.drawImage(x.b,0,0,CV,CV);x.b.close();setShape(1);shown={film:F.find(f=>f.id===x.p.f),i:'p'+x.p.n};cv.dataset.frame=shown.i;pfill();label();return true}
if(PF.on)fetch('fp/pool.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(a=>{PF.list=a;pull()}).catch(()=>{PF.on=false;pull()});

async function pull(){if(coarse||PF.on&&!PF.list)return;if(pUse(inScope())){pfill();return}const list=inScope();if(!list.length)return;const want=Math.min(POOL,list.length===1?2:list.length);
  while(decks.length+loading<want){
    const free=queue.filter(f=>list.includes(f)&&!(list.length>1&&decks.some(d=>d.f===f)));let f=free[0];
    if(f)queue.splice(queue.indexOf(f),1);else{const rest=list.filter(f=>list.length===1||!decks.some(d=>d.f===f));if(!rest.length||queue.filled===turn&&loading){break}queue=shuffle([...rest]);queue.filled=turn;f=queue.shift()}
    loading++;const g=gen,n=f.packs||1,k=packNo[f.id]=((packNo[f.id]??(Math.random()*n|0))+1)%n;
    fetch(`f/${f.id}-${k}.json`).then(r=>{if(!r.ok)throw 0;return r.json()}).then(a=>{if(g!==gen)return;
      const d={f,k,n:a.length,blobs:a.map(b=>new Blob([Uint8Array.from(atob(b),c=>c.charCodeAt(0))],{type:'image/jpeg'})),order:shuffle(a.map((_,i)=>i)),ready:[],busy:0,used:0};decks.push(d);fill(d)})

<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<title>Elad Asulin · mobile test B</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&display=swap">
<style>
:root{--g:max(20px,env(safe-area-inset-left));--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden;-webkit-text-size-adjust:100%}
body{font-family:Jost,Futura,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
#feed{position:fixed;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.reel{position:relative;height:100vh;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#000}
.reel .blur{position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);object-fit:cover;filter:blur(28px) brightness(.45);transform:translateZ(0)}
.reel .pic,.reel video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.reel.tall .pic,.reel.tall video{object-fit:cover}
.reel:not(.tall) .pic,.reel:not(.tall) video{height:auto;bottom:30%;top:calc(env(safe-area-inset-top) + 56px)}   /* wide films sit above the text */
.reel video{opacity:0;transition:opacity .5s ease}
.reel video.ready{opacity:1}
.reel .fade{position:absolute;left:0;right:0;bottom:0;height:52%;background:linear-gradient(transparent,rgba(0,0,0,.55) 45%,rgba(0,0,0,.88));pointer-events:none}
.reel .tap{position:absolute;inset:0;z-index:1}
.info{position:absolute;left:var(--g);right:var(--g);bottom:calc(env(safe-area-inset-bottom) + 30px);z-index:2;pointer-events:none}
.info .topic{margin:0 0 10px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#a0a0a0}
.info h2{margin:0;font-size:clamp(30px,8.6vw,42px);line-height:1.05;font-weight:400;letter-spacing:-.01em}
.info .cl{margin:10px 0 0;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.info .ln{margin:5px 0 0;font-size:15px;line-height:1.45;color:#d6d6d6;max-width:34em}
.acts{display:flex;gap:10px;margin-top:16px;pointer-events:auto}
.acts button{font-size:14px;letter-spacing:.04em;padding:9px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.55);background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.acts .open{background:#fff;color:#000;border-color:#fff}
.reel .info>*{opacity:0;transform:translateY(18px);transition:opacity 1.2s var(--ease),transform 1.2s var(--ease)}
.reel.on .info>*{opacity:1;transform:none}
.reel.on .info>*:nth-child(2){transition-delay:.08s}.reel.on .info>*:nth-child(3){transition-delay:.16s}.reel.on .info>*:nth-child(4){transition-delay:.24s}.reel.on .info>*:nth-child(5){transition-delay:.32s}
#top{position:fixed;z-index:5;left:var(--g);right:var(--g);top:calc(env(safe-area-inset-top) + 16px);display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:500;pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.6)}
#top span{font-weight:400;font-size:13px;color:#ccc}
.end{display:flex;flex-direction:column;justify-content:center;padding:0 var(--g);gap:18px}
.end p{margin:0;font-size:22px;color:#aaa}
.end .links{display:flex;gap:28px;font-size:22px}
.end a{text-decoration:none;border-bottom:1px solid #555;padding-bottom:3px}
/* full-screen player with sound */
#pl{position:fixed;inset:0;z-index:10;background:#000;display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
#pl.open{opacity:1;visibility:visible;transition:opacity .35s ease}
#pl video{flex:1;min-height:0;width:100%;object-fit:contain;background:#000}
#pt{flex:1;margin:0;font-size:15px;color:#bbb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar{flex:none;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 10px) max(14px,env(safe-area-inset-right)) 10px var(--g)}
#close{flex:none;font-size:15px;letter-spacing:.06em;padding:9px 18px;border:1px solid rgba(255,255,255,.55);border-radius:999px}
@media (prefers-reduced-motion:reduce){.reel .info>*{transform:none;transition:opacity .4s}}
</style></head><body>
<div id="top"><b style="font-weight:500">Elad Asulin</b><span id="cnt"></span></div>
<div id="feed"></div>
<div id="pl" role="dialog" aria-modal="true" aria-label="Film"><div id="bar"><p id="pt"></p><button id="close" type="button">Close</button></div><video id="pv" controls playsinline preload="none"></video></div>
<script>
const MEDIA='https://eladasulin.github.io/media/',ORDER=['Animation & AI','Commercials & Brand Films','Campaigns','Documentary','Fiction & Music Videos'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const src=f=>MEDIA+(f.episodes?f.episodes[0].v:f.id)+'.mp4',poster=f=>'../p/'+f.id+'.jpg';
const split=f=>{const l=f.line||'',m=l.match(/^([^—]{1,80}?)\s+—\s+(.*)$/);return m?[m[1],m[2]]:[f.client||'',l]};
const tall=f=>{const [w,h]=f.aspect.split('/').map(Number);return h>w};
const feed=document.getElementById('feed'),pl=document.getElementById('pl'),pv=document.getElementById('pv'),cnt=document.getElementById('cnt');
let F=[],reels=[],cur=null,sound=false;
fetch('../films.json').then(r=>r.json()).then(a=>{
  const reel=a.filter(f=>f.no_beam),rest=[...new Set(a.filter(f=>!f.no_beam).map(f=>f.category))].sort((x,y)=>ORDER.indexOf(x)-ORDER.indexOf(y)).flatMap(c=>a.filter(f=>!f.no_beam&&f.category===c));
  F=[...reel,...rest];
  feed.innerHTML=F.map((f,i)=>{const [c,l]=split(f);return `<section class="reel${tall(f)?' tall':''}" data-i="${i}">
    ${tall(f)?'':`<img class="blur" alt="" loading="lazy" src="${poster(f)}">`}<img class="pic" alt="" ${i>1?'loading="lazy"':''} src="${poster(f)}">
    <div class="fade"></div><button class="tap" type="button" aria-label="Sound on or off"></button>
    <div class="info">${f.no_beam?'':`<p class="topic">${esc(f.category)}</p>`}<h2>${esc(f.title)}</h2>${c?`<p class="cl">${esc(c)}</p>`:''}<p class="ln">${esc(l)}</p>
    <div class="acts"><button class="snd" type="button">Sound on</button><button class="open" type="button">Watch with sound</button></div></div></section>`}).join('')
    +`<section class="reel end"><p>creating stories</p><div class="links"><a href="/#about">About</a><a href="/#contact">Contact</a></div></section>`;
  reels=[...feed.querySelectorAll('.reel[data-i]')];
  reels.forEach(r=>{const f=F[+r.dataset.i];
    r.querySelector('.tap').addEventListener('click',()=>toggle(r));
    r.querySelector('.snd').addEventListener('click',()=>toggle(r));
    r.querySelector('.open').addEventListener('click',()=>open(f));
  });
  const go=reels.find(r=>F[+r.dataset.i].id===location.hash.slice(1));if(go)feed.scrollTop=go.offsetTop;   // #slug opens the feed at that film
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>=.6)activate(e.target)}),{root:feed,threshold:[.6]});
  feed.querySelectorAll('.reel').forEach(r=>io.observe(r));
});
function vid(r){let v=r.querySelector('video');if(v)return v;const f=F[+r.dataset.i];
  v=document.createElement('video');v.muted=true;v.defaultMuted=true;v.loop=true;v.playsInline=true;v.setAttribute('playsinline','');v.setAttribute('muted','');v.preload='metadata';
  v.addEventListener('playing',()=>v.classList.add('ready'));v.src=src(f);r.querySelector('.pic').after(v);return v}
function drop(r){const v=r&&r.querySelector('video');if(!v)return;v.pause();v.removeAttribute('src');v.load();v.remove()}
function activate(r){
  if(r===cur)return;const prev=cur;cur=r;
  feed.querySelectorAll('.reel.on').forEach(x=>x.classList.remove('on'));r.classList.add('on');
  // keep at most the current reel's video; everything else is freed
  reels.forEach(x=>{if(x!==r)drop(x)});
  if(!r.dataset.i){cnt.textContent='';return}
  cnt.textContent=(+r.dataset.i+1)+' / '+F.length;
  const v=vid(r);v.muted=!sound;label(r);
  v.play().catch(()=>{v.muted=true;sound=false;label(r);v.play().catch(()=>{})});
}
function label(r){const b=r.querySelector('.snd');if(b)b.textContent=sound?'Sound off':'Sound on'}
function toggle(r){const v=vid(r);sound=v.muted;v.muted=!sound;if(v.paused)v.play().catch(()=>{});label(r)}
function open(f){const v=cur&&cur.querySelector('video');if(v)v.pause();document.getElementById('pt').textContent=f.title;pv.poster=poster(f);pv.src=src(f);pv.muted=false;pl.classList.add('open');pv.play().catch(()=>{})}
function close(){pv.pause();pv.removeAttribute('src');pv.load();pl.classList.remove('open');const v=cur&&cur.querySelector('video');if(v)v.play().catch(()=>{})}
document.getElementById('close').addEventListener('click',close);
document.addEventListener('visibilitychange',()=>{const v=cur&&cur.querySelector('video');if(!v||pl.classList.contains('open'))return;document.hidden?v.pause():v.play().catch(()=>{})});
</script>
</body></html>

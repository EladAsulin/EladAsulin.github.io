<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Elad Asulin · slate test</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&display=swap">
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:Jost,system-ui,sans-serif;overflow:hidden}
#st{position:fixed;inset:0}
/* six diagonal bands fill the screen; every band shows one frame, framed for its own slice (focal point on the band's centre line) */
.band{position:absolute;inset:0;opacity:0;transition:opacity 1.4s cubic-bezier(.16,1,.3,1)}.band.on{opacity:1}
.ly{position:absolute;inset:0;overflow:hidden}.ly img{position:absolute;display:block;max-width:none;user-select:none;-webkit-user-drag:none}
.ly.in{transition:clip-path 1.1s cubic-bezier(.7,0,.2,1)}
#dim{position:fixed;inset:0;pointer-events:none;background:linear-gradient(165deg,rgba(0,0,0,calc(var(--d) + .25)) 0%,rgba(0,0,0,var(--d)) 38%,rgba(0,0,0,var(--d)) 70%,rgba(0,0,0,calc(var(--d) + .2)) 100%)}
:root{--d:.32}
.tx{position:fixed;left:max(7vw,24px);top:max(9vh,28px);text-shadow:0 1px 3px rgba(0,0,0,.55),0 2px 28px rgba(0,0,0,.6)}
h1{font-weight:400;font-size:clamp(46px,8.4vw,116px);line-height:1;margin:0;letter-spacing:-.015em}
.tx p{font-size:clamp(20px,2.3vw,30px);margin:.45em 0 0;font-weight:300}
.nav{position:fixed;left:max(7vw,24px);bottom:max(11vh,40px);display:flex;flex-direction:column;align-items:flex-start;gap:.15em;font-size:clamp(28px,3vw,44px);text-shadow:0 1px 3px rgba(0,0,0,.6),0 2px 24px rgba(0,0,0,.7)}
.nav a{cursor:pointer;color:inherit;text-decoration:none;padding:2px 0}.nav a:hover,.nav a[aria-current]{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.25em}
#where{font-size:14px;opacity:.75;margin-top:.5em;min-height:1.2em}
.sw{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;font-size:13px}
button,.sw label{font:inherit;font-size:13px;color:#fff;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.4);padding:8px 12px;border-radius:4px;cursor:pointer;display:flex;gap:8px;align-items:center}
input[type=range]{width:90px;accent-color:#fff}
@media(prefers-reduced-motion:reduce){.ly.in{transition:opacity .4s}.band{transition:none}}
</style></head><body>
<div id="st"></div><div id="dim"></div>
<div class="tx"><h1>Elad Asulin</h1><p>creating stories</p></div>
<nav class="nav"><a data-go="Work">Work</a><a data-go="About">About</a><a data-go="Contact">Contact</a><span id="where"></span></nav>
<div class="sw"><label>Dim <input id="dm" type="range" min="0" max=".8" step=".02" value=".32"></label><button id="wb">Wipe</button></div>
<script>
let D;
/* geometry: the same numbers as flash-pool/tools/bandgeo.py, where every frame was checked (no face cut by a band edge, no text inside its band) */
const LAND={top:[0,22,40,58,76,94,100],bot:[0,6,24,42,60,78,100]},PORT={left:[0,22,39,56,73,90,100],right:[0,8,25,42,59,76,100]};
const st=document.getElementById('st'),calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
const isPort=()=>innerHeight>innerWidth;let O=isPort()?'port':'land';
function poly(W,H,i,p){if(p){const L=PORT.left,R=PORT.right;return [[0,L[i]*H/100],[W,R[i]*H/100],[W,R[i+1]*H/100],[0,L[i+1]*H/100]]}const T=LAND.top,B=LAND.bot;return [[T[i]*W/100,0],[T[i+1]*W/100,0],[B[i+1]*W/100,H],[B[i]*W/100,H]]}
function cpath(i,p){if(p){const L=PORT.left,R=PORT.right;return `polygon(0 ${L[i]}%,100% ${R[i]}%,100% ${R[i+1]}%,0 ${L[i+1]}%)`}const T=LAND.top,B=LAND.bot;return `polygon(${T[i]}% 0,${T[i+1]}% 0,${B[i+1]}% 100%,${B[i]}% 100%)`}
function centre(W,H,i,p,v){if(p){const L=PORT.left,R=PORT.right,a=(L[i]+L[i+1])/200*H,b=(R[i]+R[i+1])/200*H;return a+(b-a)*v/W}const T=LAND.top,B=LAND.bot,a=(T[i]+T[i+1])/200*W,b=(B[i]+B[i+1])/200*W;return a+(b-a)*v/H}
/* cover the band's box, zoom z, put the frame's focal point on the band's centre line, never leave a gap */
function place(img,i){const fr=img.fr,W=innerWidth,H=innerHeight,p=O==='port',P=poly(W,H,i,p),xs=P.map(q=>q[0]),ys=P.map(q=>q[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),bw=x1-x0,bh=y1-y0;
  const s=fr.z*Math.max(bw/fr.w,bh/fr.h),dw=fr.w*s,dh=fr.h*s;let tx,ty;if(p){tx=x0+fr.fx*bw;ty=centre(W,H,i,p,tx)}else{ty=y0+fr.fy*bh;tx=centre(W,H,i,p,ty)}
  const l=Math.min(x0,Math.max(x1-dw,tx-fr.fx*dw)),t=Math.min(y0,Math.max(y1-dh,ty-fr.fy*dh));Object.assign(img.style,{left:l+'px',top:t+'px',width:dw+'px',height:dh+'px'})}
const bands=[...Array(6)].map((_,i)=>{const b=document.createElement('div');b.className='band';st.append(b);return b});
const cur=Array(6).fill(-1),recent=[];
const load=n=>{const fr=D[O][n],im=new Image();im.decoding='async';im.alt='';im.fr=fr;im.n=n;im.src='b/'+fr.s;im.ready=(im.decode?im.decode():new Promise(r=>im.onload=r)).catch(()=>{});return im};
function layer(i,im){const l=document.createElement('div');l.className='ly';l.append(im);place(im,i);bands[i].append(l);return l}
/* the next screen: a new frame for every band, valid in that band, from six films none of which is on screen now */
function pickSet(){const busy=new Set(cur.filter(n=>n>=0).map(n=>D[O][n].f)),out=[];
  for(let i=0;i<6;i++){const used=new Set([...busy,...out.map(n=>D[O][n].f)]);let c=D[O].map((f,n)=>n).filter(n=>D[O][n].b.includes(i)&&!used.has(D[O][n].f)&&!recent.includes(n));
    if(!c.length)c=D[O].map((f,n)=>n).filter(n=>D[O][n].b.includes(i)&&!used.has(D[O][n].f));if(!c.length)c=D[O].map((f,n)=>n).filter(n=>D[O][n].b.includes(i)&&n!==cur[i]);out.push(c[Math.random()*c.length|0])}
  return out}
let ahead=null;function prepare(){ahead=pickSet().map(load)}
function show(set,anim){set.forEach((im,i)=>{cur[i]=im.n;recent.push(im.n);if(recent.length>Math.min(24,D[O].length-8))recent.shift()});
  set.forEach((im,i)=>{const b=bands[i];if(!anim){b.replaceChildren();layer(i,im);setTimeout(()=>b.classList.add('on'),150+i*160);return}
    const go=()=>{const l=layer(i,im),p=O==='port',from=p?(i%2?'inset(0 0 0 100%)':'inset(0 100% 0 0)'):(i%2?'inset(100% 0 0 0)':'inset(0 0 100% 0)');
      if(calm){l.style.opacity=0;l.classList.add('in');l.getBoundingClientRect();l.style.opacity=1}else{l.style.clipPath=from;l.getBoundingClientRect();l.classList.add('in');l.style.clipPath='inset(0)'}
      setTimeout(()=>{while(b.children.length>1)b.firstChild.remove()},1250)};
    Promise.race([im.ready,new Promise(r=>setTimeout(r,2500))]).then(()=>setTimeout(go,i*140))})}
let busyWipe=0;function wipe(){if(busyWipe)return;busyWipe=1;const set=ahead;show(set,true);setTimeout(()=>{busyWipe=0;prepare()},6*140+1150)}
function relayout(){bands.forEach((b,i)=>{b.style.clipPath=cpath(i,O==='port');b.querySelectorAll('img').forEach(im=>place(im,i))})}
function start(){bands.forEach((b,i)=>b.style.clipPath=cpath(i,O==='port'));const first=D.first[O].map(load);show(first,false);prepare()}
/* a real turn of the screen deals a fresh set for the new shape; a passing resize only re-frames */
let rt=0;addEventListener('resize',()=>{relayout();clearTimeout(rt);rt=setTimeout(()=>{const o=isPort()?'port':'land';if(o!==O){O=o;cur.fill(-1);recent.length=0;start()}},400)});
document.querySelectorAll('[data-go]').forEach(a=>a.onclick=()=>{document.querySelectorAll('[data-go]').forEach(x=>x.toggleAttribute('aria-current',x===a));document.getElementById('where').textContent=a.dataset.go+' (test: the panel would open here)';wipe()});
document.getElementById('wb').onclick=wipe;
const dm=document.getElementById('dm');dm.oninput=()=>document.documentElement.style.setProperty('--d',dm.value);
/* the frames and their framing live in b/bands.json (written by flash-pool/tools/export_bands.py, then bands_from_db.py with Elad's edits) */
fetch('b/bands.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{D=d;start()});
</script>
</body></html>
